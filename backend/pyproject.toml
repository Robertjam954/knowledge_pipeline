[project]
name = "knowledge-pipeline"
version = "0.1.0"
description = "Personal knowledge pipeline: web + Apple Notes -> Obsidian vault -> local RAG QA (LM Studio) -> auto-templated blog"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "youtube-transcript-api>=0.6",
    "jinja2>=3.1",
    "openai>=1.50",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
